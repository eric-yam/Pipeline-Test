# This is a basic workflow to help you get started with Actions

name: Demo - CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write

    environment: 
      name: github-pages

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Step 1 - Checkout to GitHub workspace
        uses: actions/checkout@v4

      - name: Step 2 - Setup Java JDK
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 17
          distribution: temurin

      - name: Install Allure
        run: npm install -g allure          
    
      # Builds/Executes Maven project, omits logs on dependency download progress
      - name: Step 2 - Build/Execute Tests
        run: mvn -B clean verify --no-transfer-progress

      - name: Generate Allure Report
        if: always()
        run: |
          allure generate

                              
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          # Artifact name. If the `archive` input is `false`, the name of the file uploaded will be the artifact name.
          name: allure-report
          # A file, directory or wildcard pattern that describes what to upload.
          path: allure-report


      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
        # with:
        #   # Optional static site generator to attempt to configure: "nuxt", "next", "gatsby", or "sveltekit"
        #   static_site_generator: # optional
        #   # Optional file path to static site generator configuration file
        #   generator_config_file: # optional
        #   # GitHub token
        #   token: # default is ${{ github.token }}
        #   # Try to enable Pages for the repository if it is not already enabled. This option requires a token other than `GITHUB_TOKEN` to be provided. In the context of a Personal Access Token, the `repo` scope or Pages write permission is required. In the context of a GitHub App, the `administration:write` and `pages:write` permissions are required.
        #   enablement: # optional, default is false

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          # Artifact name
          name: Test Results
          # Path of the directory containing the static assets.
          path: allure-report
          # # Duration after which artifact will expire in days.
          # retention-days: # optional, default is 1
          # # Include hidden files and directories (those starting with a dot) in the artifact. Excludes .git and .github regardless.
          # include-hidden-files: # optional, default is false


      - name: Deploy GitHub Pages site
        uses: actions/deploy-pages@v3.0.2-node.24
        with:
          # GitHub token
          # token: # default is ${{ github.token }}
          # Time in milliseconds after which to timeout and cancel the deployment (default: 10 minutes)
          # timeout: # optional, default is 600000
          # Maximum number of status report errors before cancelling a deployment (default: 10)
          # error_count: # optional, default is 10
          # Time in milliseconds between two deployment status report (default: 5 seconds)
          # reporting_interval: # optional, default is 5000
          # Name of the artifact to deploy
          artifact_name: Test Results
          # Is this attempting to deploy a pull request as a GitHub Pages preview site? (NOTE: This feature is only in alpha currently and is not available to the public!)
          # preview: # optional, default is false
          
          
          

      - name: Look at directory
        run: |
          echo Current:
          ls
          cd target
          echo
          echo Current:
          ls                  
