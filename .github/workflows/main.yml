# This is a basic workflow to help you get started with Actions

name: Demo - CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Step 1 - Checkout to GitHub workspace
        uses: actions/checkout@v4

      - name: Step 2 - Setup Java JDK
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 17
          distribution: temurin
    
      # Builds/Executes Maven project, omits logs on dependency download progress
      - name: Step 2 - Build/Execute Tests
        run: mvn -B clean verify --no-transfer-progress

      - name: Step 3 - Allure Report Official        
        uses: allure-framework/allure-action@v0
        with:
          # The report directory to scan for files
          report-directory: ./allure-report

      - name: Step 4 - Generate Allure Report
        uses: simple-elf/allure-report-action@v1.7
        if: always()  # Run even if tests fail
        with:
          allure_results: allure-results        # folder Maven writes raw results to
          allure_report: allure-report          # folder the HTML report is generated into
          allure_history: allure-history        # optional: tracks history across runs
          keep_reports: 10                      # optional: number of past reports to keep

      - name: Step 5 - Upload Allure Report as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Step 6 - Verify Allure CLI version
        if: always()
        run: allure --version
