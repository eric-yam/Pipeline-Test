# This is a basic workflow to help you get started with Actions

name: Demo - CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions: # Added permissions to allow access to GitHub pages
      id-token: write
      pages: write

    environment:
      name: github-pages

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Step 1 - Checkout to GitHub workspace
        uses: actions/checkout@v4

      - name: Step 2 - Setup Java JDK
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 17
          distribution: temurin

      - name: Step 3 - Install Allure
        run: npm install -g allure

      # Builds/Executes Maven project, omits logs on dependency download progress
      - name: Step 4 - Build/Execute Tests
        run: mvn -B clean verify --no-transfer-progress

      - name: Step 5 - Generate Allure Report
        if: always()
        run: |
          allure generate

      - name: Step 6 - Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v6.0.0

      - name: Step 7 - Upload GitHub Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          # Artifact name
          name: Test Results
          # Path of the directory containing the static assets.
          path: allure-report

      - name: Step 8 - Deploy GitHub Pages site
        if: always()
        uses: actions/deploy-pages@v3.0.2-node.24
        with:
          # Artifact name must match the uploaded artifact name in previous step
          artifact_name: Test Results

      - name: Look at directory
        run: |
          echo Current:
          ls
          cd target
          echo
          echo Current:
          ls